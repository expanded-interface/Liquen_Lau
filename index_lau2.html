<style>
  /* Una sola escena: vacío negro, trazos bioluminiscentes. Portada mínima sobre el bosque en reposo. */
  :root {
    --void: #000000;
    --ink: #e9fff6;
    --mute: #7fa89a;
    --lichen: #d4ff3a;
    --spore: #43e8ff;
    --poem: "Fraunces", "Iowan Old Style", Georgia, serif;
    --mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; }
  body { font-family: var(--mono); }
  canvas { display: block; }
  #portal {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: end start;
    padding: max(24px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 90% at 20% 100%, rgba(0,0,0,.92) 30%, rgba(0,0,0,.35) 75%, rgba(0,0,0,.1));
    transition: opacity 1.6s ease;
  }
  #portal.gone { opacity: 0; pointer-events: none; }
  .wrap { display: grid; gap: 22px; max-width: 34rem; }
  .eyebrow { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--mute); margin: 0; }
  h1 {
    font-family: var(--poem); font-style: italic; font-weight: 300;
    font-size: clamp(64px, 14vw, 148px); line-height: .86; margin: 0;
    letter-spacing: -.02em; color: var(--ink);
    text-shadow: 0 0 28px rgba(212,255,58,.35), 0 0 2px rgba(212,255,58,.6);
  }
  .line { font-family: var(--poem); font-style: italic; font-weight: 300; font-size: clamp(18px, 2.4vw, 22px); line-height: 1.45; margin: 0; color: #cfe9df; text-wrap: balance; }
  .row { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; }
  button#enter {
    font: 400 13px/1 var(--mono); letter-spacing: .28em; text-transform: uppercase;
    color: var(--void); background: var(--lichen); border: 0; border-radius: 999px;
    padding: 18px 30px; cursor: pointer;
    box-shadow: 0 0 0 1px rgba(212,255,58,.4), 0 0 40px rgba(212,255,58,.35);
  }
  button#enter:hover { box-shadow: 0 0 0 1px rgba(212,255,58,.8), 0 0 60px rgba(212,255,58,.55); }
  button#enter:focus-visible { outline: 2px solid var(--spore); outline-offset: 4px; }
  button#enter[disabled] { opacity: .5; cursor: wait; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 11px; color: var(--mute); letter-spacing: .06em; margin: 0; }
  .keys dt { color: var(--ink); }
  .keys dd { margin: 0; }
  button.ghost { font: 300 11px/1.2 var(--mono); letter-spacing: .14em; color: var(--ink); background: transparent; border: 1px solid rgba(233,255,246,.3); border-radius: 999px; padding: 12px 18px; cursor: pointer; }
  button.ghost:focus-visible { outline: 2px solid var(--spore); outline-offset: 4px; }
  button.ghost.on { border-color: var(--lichen); color: var(--lichen); }
  #status { margin: 0; min-height: 1.2em; font-size: 11px; letter-spacing: .06em; color: #ffb03a; max-width: 30rem; }
  #hint { position: fixed; left: 16px; bottom: max(14px, env(safe-area-inset-bottom)); z-index: 5; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: #4d6f63; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { #portal { transition: none; } }
</style>

<div id="portal">
  <div class="wrap">

<script type="module">
import * as THREE from 'three';
import * as xb from 'xrblocks';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

THREE.ColorManagement.enabled = false;

/* ───────────────────────── utilidades ───────────────────────── */
const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const Y = new V3(0, 1, 0), X = new V3(1, 0, 0);

const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const PN = new ImprovedNoise();
const noise = (x, y, z) => PN.noise(x, y, z);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };

const PAL = {
  trunk: col('#1fc9a8'), ring: col('#127a6a'), leaf: col('#38ff8c'), leaf2: col('#9dff5a'), moss: col('#1a8f6a'),
  usnea: col('#b8ffe6'), rock: col('#7f72ff'), rockHi: col('#b3a8ff'), crack: col('#ffe2a6'),
  lich: [col('#d4ff3a'), col('#ff8a2a'), col('#a8ffe0'), col('#ff4fa0'), col('#43e8ff'), col('#c49bff')],
  alga: col('#46ff6e'), alga2: col('#c8ff4a'), fung: col('#ffb03a'), fung2: col('#ff3da8'), elem: col('#cfefff'),
  sugar: col('#ffd54a'), water: col('#3ad8ff'),
  soil: [col('#ff9a3c'), col('#c96a2c'), col('#ffcf7a'), col('#ff6f3c')],
  sun: col('#ffd27a'), chilco: col('#ff2f6a'), ulmo: col('#f2fff8'), copihue: col('#ff2448'),
  net: col('#7dfff0'), netHot: col('#fffbe0'), ground: col('#2b4bff'),

/* ───────────────────────── shaders ───────────────────────── */
const U = {
  uTime: { value: 0 }, uScale: { value: 600 }, uFog: { value: 0.0012 },
  uWaveO: { value: new V3() }, uWaveR: { value: 0 }, uWaveA: { value: 0 }, uPulseT: { value: 0 },
};
const PV = `
attribute vec3 aColor; attribute float aSize; attribute float aReveal; attribute float aPhase; attribute float aT;
uniform float uTime,uScale,uFog,uOpacity,uReveal,uTwinkle,uPulse,uPulseT,uWaveR,uWaveA,uMaxSize; uniform vec3 uWaveO;
varying vec3 vColor; varying float vAlpha;
void main(){
  vec4 wp = modelMatrix*vec4(position,1.0);
  vec4 mv = viewMatrix*wp;
  float rv = clamp((uReveal-aReveal)*12.0,0.0,1.0);
  float tw = 1.0-uTwinkle+uTwinkle*(0.5+0.5*sin(uTime*1.3+aPhase*6.2831));
  float d = length(mv.xyz);
  float fog = exp(-d*d*uFog);
  float wd = (length(wp.xz-uWaveO.xz)-uWaveR)/0.9;
  float wave = uWaveA*exp(-wd*wd);
  float pl = uPulse*pow(fract(uPulseT-aT),18.0);
  vAlpha = uOpacity*rv*tw*fog;
  vColor = aColor*(1.0+2.2*wave+2.5*pl);
  float sc = length(modelMatrix[0].xyz);
  float s = aSize*sc*uScale*(0.45+0.55*rv)*(1.0+0.7*wave+1.2*pl)/max(-mv.z,0.05);
  gl_PointSize = rv>0.001 ? min(s,uMaxSize) : 0.0;

}`;
const PF = `
varying vec3 vColor; varying float vAlpha;
void main(){
  vec2 c = gl_PointCoord-0.5; float r2 = dot(c,c)*4.0; if(r2>1.0) discard;
  float a = exp(-r2*3.2)*(1.0-r2) + 0.5*exp(-r2*22.0);
  gl_FragColor = vec4(vColor, a*vAlpha);

const LV = `
attribute vec3 aColor; attribute float aReveal; attribute float aT;
uniform float uTime,uFog,uOpacity,uReveal,uPulse,uPulseT,uWaveR,uWaveA; uniform vec3 uWaveO;
varying vec3 vColor; varying float vAlpha;
void main(){
  vec4 wp = modelMatrix*vec4(position,1.0);
  vec4 mv = viewMatrix*wp;
  float rv = clamp((uReveal-aReveal)*25.0,0.0,1.0);
  float d = length(mv.xyz);
  float fog = exp(-d*d*uFog);
  float wd = (length(wp.xz-uWaveO.xz)-uWaveR)/0.9;
  float wave = uWaveA*exp(-wd*wd);
  float pl = pow(fract(uPulseT-aT),14.0);
  vAlpha = rv*fog*(uOpacity*(1.0+2.0*wave) + uPulse*pl);
  vColor = aColor*(1.0+wave+1.5*uPulse*pl);
  gl_Position = projectionMatrix*mv;
}`;
const LF = `varying vec3 vColor; varying float vAlpha; void main(){ gl_FragColor = vec4(vColor, vAlpha); }`;

function pointMat(o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uOpacity: { value: o.opacity ?? 1 }, uReveal: { value: o.reveal ?? 2 }, uTwinkle: { value: o.twinkle ?? 0.25 }, uPulse: { value: 0 }, uMaxSize: { value: o.maxSize ?? 40 } },
    vertexShader: PV, fragmentShader: PF, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
}
function lineMat(o = {}) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uOpacity: { value: o.opacity ?? 1 }, uReveal: { value: o.reveal ?? 2 }, uPulse: { value: 0 } },
    vertexShader: LV, fragmentShader: LF, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
}

/* Acumulador de trazos y esporas */
class Geo {
  constructor() { this.L = { p: [], c: [], r: [], t: [] }; this.P = { p: [], c: [], s: [], r: [], ph: [], t: [] }; }
  seg(a, b, c, ra = 0, rb = ra, ta = 0, tb = ta, c2 = c) {
    const L = this.L; L.p.push(a.x, a.y, a.z, b.x, b.y, b.z); L.c.push(c.r, c.g, c.b, c2.r, c2.g, c2.b); L.r.push(ra, rb); L.t.push(ta, tb);
  }
  poly(pts, c, r0 = 0, r1 = r0, t0 = 0, tScale = 0, c1 = null) {

      const a = pts[i - 1], b = pts[i], l = a.distanceTo(b), f0 = (i - 1) / (n - 1), f1 = i / (n - 1);

  }

      geo.setAttribute('aColor', new THREE.Float32BufferAttribute(this.L.c, 3));
      geo.setAttribute('aReveal', new THREE.Float32BufferAttribute(this.L.r, 1));
      geo.setAttribute('aT', new THREE.Float32BufferAttribute(this.L.t, 1));

    }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(this.P.p, 3));
      geo.setAttribute('aColor', new THREE.Float32BufferAttribute(this.P.c, 3));
      geo.setAttribute('aSize', new THREE.Float32BufferAttribute(this.P.s, 1));
      geo.setAttribute('aReveal', new THREE.Float32BufferAttribute(this.P.r, 1));
      geo.setAttribute('aPhase', new THREE.Float32BufferAttribute(this.P.ph, 1));
      geo.setAttribute('aT', new THREE.Float32BufferAttribute(this.P.t, 1));

}
function setU(obj, name, v) {
  for (const m of [obj.lines, obj.points]) if (m && m.material.uniforms[name]) m.material.uniforms[name].value = v;
}
function setOp(obj, v, lineK = 1, pointK = 1) {
  if (obj.lines) obj.lines.material.uniforms.uOpacity.value = v * lineK;
  if (obj.points) obj.points.material.uniforms.uOpacity.value = v * pointK;

}
function dynPoints(n, o = {}) {
  const geo = new THREE.BufferGeometry();
  const a = { position: new Float32Array(n * 3), aColor: new Float32Array(n * 3), aSize: new Float32Array(n), aReveal: new Float32Array(n), aPhase: new Float32Array(n), aT: new Float32Array(n) };
  for (const k in a) { const it = (k === 'position' || k === 'aColor') ? 3 : 1; const at = new THREE.BufferAttribute(a[k], it); if (k === 'position' || k === 'aColor' || k === 'aSize') at.setUsage(THREE.DynamicDrawUsage); geo.setAttribute(k, at); }
  for (let i = 0; i < n; i++) a.aPhase[i] = rnd();

}
function dynLines(nSeg, o = {}) {
  const geo = new THREE.BufferGeometry();
  const a = { position: new Float32Array(nSeg * 6), aColor: new Float32Array(nSeg * 6), aReveal: new Float32Array(nSeg * 2), aT: new Float32Array(nSeg * 2) };
  for (const k in a) { const it = (k === 'position' || k === 'aColor') ? 3 : 1; const at = new THREE.BufferAttribute(a[k], it); if (k === 'position' || k === 'aColor') at.setUsage(THREE.DynamicDrawUsage); geo.setAttribute(k, at); }

/* ───────────────────────── organismos ───────────────────────── */
function lichenPatch(g, P, N, size, c, rev = 0, spread = 0.06, n = 40, t = 0) {
  const [T, B] = basis(N); const lobes = 3 + Math.floor(rnd() * 5), ph = rnd() * TAU;
  const outline = [];
  for (let i = 0; i <= 26; i++) { const a = i / 26 * TAU, rr = size * (0.72 + 0.28 * Math.cos(lobes * a + ph)); outline.push(P.clone().addScaledVector(T, Math.cos(a) * rr).addScaledVector(B, Math.sin(a) * rr).addScaledVector(N, 0.006)); }
  g.poly(outline, c.clone().multiplyScalar(0.75), rev + spread, rev + spread, t, 0);
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, f = Math.sqrt(rnd()), rr = size * f * (0.72 + 0.28 * Math.cos(lobes * a + ph));

    g.pt(p, jit(c, 0.25).multiplyScalar(1.15 - 0.4 * f), (0.012 + 0.01 * rnd()) * (0.6 + size * 4), rev + f * spread, rnd(), t);

}

function usnea(g, start, rev, t = 0) {
  const k = 2 + Math.floor(rnd() * 3);
  for (let s = 0; s < k; s++) {
    const pts = [start.clone()]; let p = start.clone(); const len = R(0.3, 1.1), n = 7;
    for (let i = 0; i < n; i++) { p = p.clone().add(new V3(R(-0.04, 0.04), -len / n, R(-0.04, 0.04))); pts.push(p); }

function branch(g, start, dir, L, depth, rev, o) {
  const n = 4; const pts = [start.clone()]; const d = dir.clone(); let p = start.clone();

  if (o.anchors && depth === 0) o.anchors.push({ p: pts[n].clone(), kind: 'crown', tree: o.treeId });

    const kids = depth === 0 ? 3 : 2;

    for (let k = 0; k < nn; k++) { const q = tip.clone().add(randIn(cr)); q.y += cr * 0.25; fl.pt(q, jit(o.leafCol ?? PAL.leaf, 0.3), R(0.025, 0.05), r1 + 0.02 + rnd() * 0.06, rnd(), o.t ?? 0); }

function tree(g, x, z, H, o = {}) {

    for (let k = 0; k <= NS * 2; k++) { const a = k / (NS * 2) * TAU; pts.push(new V3(c.x + Math.cos(a) * r, h, c.z + Math.sin(a) * r)); }
    g.poly(pts, o.ringCol ?? PAL.ring, revH(h), revH(h), tt, 0);

const SOP = [0.8, 0.55, 0.6, 0.4];

  enter() {
    music.preset({ drone: 0.4, shimmer: 0.05 }); music.tickRate = 0; M5.g.visible = true; dir.P5 = 0; dir.life = 0.3; dir.stageShown = -1;
    breath.onInhale = () => { dir.inhaling = true; music.bellNote(62, undefined, 0.05); };

/* ───────────────────────── script XR Blocks ───────────────────────── */
class Liquen extends xb.Script {
  async init() {
    const r = xb.core.renderer; r.setClearColor(0x000000, 1);
    xb.core.scene.background = new THREE.Color(0x000000);
    this.add(scene0);
    ground = buildGround(); ground.group.visible = false; scene0.add(ground.group);
    M1 = buildM1(); M2 = buildM2(); M3 = buildM3(); M4 = buildM4(); M5 = buildM5(M4.C); M6 = buildM6(M5.anchors, M4.C);
    for (const m of [M2, M3, M4, M5, M6]) m.g.visible = false;
    scene0.add(M1.g, M2.g, M3.g, M4.g, M5.g, M6.g, poem.mesh, label.mesh);
    // vista previa: el bosque en reposo
    setOp(M1.forest, 0.8, 0.3, 0.4); setOp(M1.leaves, 0.7, 0.35, 0.55); setU(M1.lich, 'uReveal', 0.55);
    const tips = dynPoints(2, { twinkle: 0, maxSize: 30 }); tips.a.aColor.set([0.83, 1, 0.23, 0.26, 0.9, 1]); tips.a.aSize[0] = tips.a.aSize[1] = 0.025; tips.geo.attributes.aColor.needsUpdate = true; tips.geo.attributes.aSize.needsUpdate = true;
    this.tips = tips; scene0.add(tips.points);
    const fonts = Promise.all([document.fonts.load('italic 300 66px "Fraunces"'), document.fonts.load('300 24px "Martian Mono"')]).catch(() => {});
    await Promise.race([fonts, new Promise((res) => setTimeout(res, 2500))]);
    await ready();
  }
  onXRSessionStarted() { entering = false; begin(); }
  onXRSessionEnded() { portal.classList.remove('gone'); btn.disabled = false; btn.textContent = 'Volver a entrar'; input.trigger = false; breath.grip(false); }
  onSelectStart() { input.trigger = true; music.start(); if (dir.idx >= 0 && dir.idx < 3 || dir.idx === 5) { emitWave(head.clone(), 0.8); music.bellNote(pick([69, 72, 74, 77, 81]), undefined, 0.1); } }
  onSelectEnd() { input.trigger = false; }

  onSqueezeEnd() { breath.grip(false); }
  update() {
    const now = performance.now() / 1000, dt = Math.min(0.05, now - clock.last) * SPEED; clock.last = now; clock.t += dt; U.uTime.value = clock.t;

/* ───────────────────────── portada y arranque ───────────────────────── */
const btn = document.getElementById('enter'), portal = document.getElementById('portal'), hint = document.getElementById('hint');

    document.getElementById('keys').innerHTML = '<dt>arrastra</dt><dd>mirar</dd><dt>espacio</dt><dd>gatillo · empuja el tiempo</dd><dt>B</dt><dd>mantén para inhalar, suelta para exhalar</dd><dt>N</dt><dd>siguiente umbral</dd>';
    if (!window.isSecureContext) say('Para entrar en realidad virtual, abre esta página desde una dirección https.');
